<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeLens — Vector Search Accuracy Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --card:           #ffffff;

    --status-good:     #0ca30c;
    --status-good-bg:  #e7f6e7;
    --status-critical: #d03b3b;
    --status-critical-bg: #fbe9e9;

    --vector: #9b7ede;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --card:           #221f1f;

      --status-good:     #0ca30c;
      --status-good-bg:  #10331a;
      --status-critical: #e66767;
      --status-critical-bg: #3a1616;

      --vector: #b199e8;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.45;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }

  header.top { margin-bottom: 20px; }
  header.top h1 { font-size: 22px; margin: 0 0 6px; }
  header.top .meta { color: var(--text-secondary); font-size: 13px; }
  header.top .meta code { background: var(--gridline); border-radius: 4px; padding: 1px 5px; }

  .method-note {
    background: var(--card); border: 1px solid var(--vector); border-left: 3px solid var(--vector);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 24px;
    font-size: 13px; color: var(--text-secondary); line-height: 1.6;
  }
  .method-note strong { color: var(--vector); }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-tile {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-tile .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat-tile .value { font-size: 26px; font-weight: 600; margin-top: 4px; font-variant-numeric: proportional-nums; }
  .stat-tile .sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 18px;
  }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .card .query { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  .card .query code { background: var(--gridline); border-radius: 4px; padding: 1px 5px; }

  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .bar-track {
    flex: 1; display: flex; height: 22px; border-radius: 6px; overflow: hidden;
    background: var(--gridline); gap: 2px;
  }
  .bar-seg { height: 100%; }
  .bar-seg.good { background: var(--status-good); }
  .bar-seg.critical { background: var(--status-critical); }
  .bar-pct { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text-secondary); width: 46px; text-align: right; flex-shrink: 0; }

  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin: 8px 0 14px; }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .case-breakdown { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .case-breakdown b { color: var(--text-primary); font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--gridline); vertical-align: top; }
  th { color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  td.num { font-variant-numeric: tabular-nums; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
    border-radius: 5px; padding: 2px 7px;
  }
  .badge.pass { background: var(--status-good-bg); color: var(--status-good); }
  .badge.fail { background: var(--status-critical-bg); color: var(--status-critical); }

  .chip { display: inline-block; font-size: 11px; border-radius: 4px; padding: 1px 6px; background: var(--gridline); color: var(--text-secondary); }

  .excluded { font-size: 12px; color: var(--text-muted); margin-top: 10px; }
  .table-wrap { overflow-x: auto; }
</style>
</head>

<script>
(function () {
  const data = JSON.parse(document.getElementById('eval-data').textContent);
  const caseLabel = { positive: 'Positive', negative: 'Negative' };

  function pct(n) { return n === null || n === undefined ? '—' : Math.round(n) + '%'; }
  function esc(s) {
    return (s === null || s === undefined ? '' : String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }

  document.getElementById('meta-line').innerHTML =
    `Dataset: <code>${esc(data.dataset)}</code> — ${data.listing_count} listings &middot; mode: <code>${esc(data.mode)}</code> &middot; generated ${esc(new Date(data.generated_at).toLocaleString())}`;

    document.getElementById('stat-section').innerHTML = `
      <div class="stat-row">
        <div class="stat-tile"><div class="label">Overall accuracy</div><div class="value">${pct(data.overall.accuracy)}</div><div class="sub">${data.overall.correct}/${data.overall.total} cases</div></div>
        <div class="stat-tile"><div class="label">Total cases</div><div class="value">${data.overall.total}</div><div class="sub">positive + negative</div></div>
        <div class="stat-tile"><div class="label">Correct</div><div class="value">${data.overall.correct}</div></div>
        <div class="stat-tile"><div class="label">Incorrect</div><div class="value">${data.overall.total - data.overall.correct}</div></div>
      </div>`;
  }

  const container = document.getElementById('dimensions');
  data.dimensions.forEach(dim => {
    if (data.mode === 'graded') {
      const stats = dim.stats;
      const correctPct = stats.total ? (stats.correct / stats.total * 100) : 0;
      const incorrectPct = stats.total ? 100 - correctPct : 0;

      let html = `<div class="card">
        <h2>${esc(dim.label)} <span style="color:var(--text-muted);font-weight:400">— ${pct(stats.accuracy)}</span></h2>
        <div class="query">query: <code>${esc(dim.query)}</code></div>
        <div class="bar-row">
          <div class="bar-track">
            ${correctPct > 0 ? `<span class="bar-seg good" style="width:${correctPct}%"></span>` : ''}
            ${incorrectPct > 0 ? `<span class="bar-seg critical" style="width:${incorrectPct}%"></span>` : ''}
          </div>
          <span class="bar-pct">${pct(stats.accuracy)}</span>
        </div>
        <div class="legend">
          <span><span class="dot" style="background:var(--status-good)"></span>Correct</span>
          <span><span class="dot" style="background:var(--status-critical)"></span>Incorrect</span>
        </div>
        <div class="case-breakdown">`;
      Object.keys(stats.by_case).forEach(caseKey => {
        const c = stats.by_case[caseKey];
        html += `<span>${esc(caseLabel[caseKey] || caseKey)}: <b>${c.correct}/${c.total}</b></span>`;
      });
      html += '</div>';

      html += '<div class="table-wrap"><table><thead><tr>' +
        '<th>Rank</th><th>MLS ID</th><th>Address</th><th>Case</th><th>Expected</th><th>Predicted</th><th>Similarity</th><th>Result</th>' +
        '</tr></thead><tbody>';
      dim.rows.forEach(r => {
        html += `<tr>
          <td class="num">${r.rank}</td>
          <td class="num">${r.mls_id}</td>
          <td>${esc(r.address || '—')}</td>
          <td><span class="chip">${esc(caseLabel[r.case] || r.case)}</span></td>
          <td>${esc(r.expected)}</td>
          <td>${esc(r.predicted)}</td>
          <td class="num">${(r.similarity * 100).toFixed(1)}%</td>
          <td>${r.pass ? '<span class="badge pass">✓ PASS</span>' : '<span class="badge fail">✗ FAIL</span>'}</td>
        </tr>`;
      });
      html += '</tbody></table></div>';

      if (dim.excluded && dim.excluded.length) {
        html += `<div class="excluded">Excluded as ambiguous in the source data (not counted above): ` +
          dim.excluded.map(e => `#${e.mls_id} ${esc(e.address || '')}`).join(', ') + '</div>';
      }
      html += '</div>';
      container.insertAdjacentHTML('beforeend', html);
    } else {
      // ungraded — just show the real top-10 ranked results, no verdict
      let html = `<div class="card">
        <h2>${esc(dim.label)}</h2>
        <div class="query">query: <code>${esc(dim.query)}</code></div>
        <div class="table-wrap"><table><thead><tr>
          <th>Rank</th><th>MLS ID</th><th>Address</th><th>Similarity</th>
        </tr></thead><tbody>`;
      dim.rows.forEach(r => {
        html += `<tr>
          <td class="num">${r.rank}</td>
          <td class="num">${r.mls_id}</td>
          <td>${esc(r.address || '—')}</td>
          <td class="num">${(r.similarity * 100).toFixed(1)}%</td>
        </tr>`;
      });
      html += '</tbody></table></div></div>';
      container.insertAdjacentHTML('beforeend', html);
    }
  });
})();
