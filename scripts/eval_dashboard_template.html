<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeLens — Ground-Truth Accuracy Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --card:           #ffffff;

    --status-good:     #0ca30c;
    --status-good-bg:  #e7f6e7;
    --status-critical: #d03b3b;
    --status-critical-bg: #fbe9e9;
    --status-warning:  #fab219;

    --series-1: #2a78d6; /* blue     */
    --series-2: #eb6834; /* orange   */
    --series-3: #1baf7a; /* aqua     */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --card:           #221f1f;

      --status-good:     #0ca30c;
      --status-good-bg:  #10331a;
      --status-critical: #e66767;
      --status-critical-bg: #3a1616;
      --status-warning:  #c98500;

      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.45;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }

  header.top { margin-bottom: 28px; }
  header.top h1 { font-size: 22px; margin: 0 0 6px; }
  header.top .meta { color: var(--text-secondary); font-size: 13px; }
  header.top .meta code { background: var(--gridline); border-radius: 4px; padding: 1px 5px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--border); background: var(--card); color: var(--text-secondary);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .tab.active { background: var(--text-primary); color: var(--page); border-color: var(--text-primary); }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-tile {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-tile .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat-tile .value { font-size: 26px; font-weight: 600; margin-top: 4px; font-variant-numeric: proportional-nums; }
  .stat-tile .sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 18px;
  }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .card .query { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  .card .query code { background: var(--gridline); border-radius: 4px; padding: 1px 5px; }

  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .bar-track {
    flex: 1; display: flex; height: 22px; border-radius: 6px; overflow: hidden;
    background: var(--gridline); gap: 2px;
  }
  .bar-seg { height: 100%; }
  .bar-seg.good { background: var(--status-good); }
  .bar-seg.critical { background: var(--status-critical); }
  .bar-pct { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text-secondary); width: 46px; text-align: right; flex-shrink: 0; }

  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin: 8px 0 14px; }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .case-breakdown { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .case-breakdown b { color: var(--text-primary); font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--gridline); vertical-align: top; }
  th { color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  td.reason { color: var(--text-secondary); max-width: 360px; }
  td.num { font-variant-numeric: tabular-nums; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
    border-radius: 5px; padding: 2px 7px;
  }
  .badge.pass { background: var(--status-good-bg); color: var(--status-good); }
  .badge.fail { background: var(--status-critical-bg); color: var(--status-critical); }
  .badge.neutral { background: var(--gridline); color: var(--text-muted); }

  .ambiguous-note { font-size: 12px; color: var(--text-muted); margin: -6px 0 12px; }

  .chip { display: inline-block; font-size: 11px; border-radius: 4px; padding: 1px 6px; background: var(--gridline); color: var(--text-secondary); }

  .excluded { font-size: 12px; color: var(--text-muted); margin-top: 10px; }

  .table-wrap { overflow-x: auto; }

  .compare-bar-group { display: grid; grid-template-columns: 140px 1fr; gap: 12px; align-items: center; margin-bottom: 10px; }
  .compare-provider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .compare-provider-row .name { width: 110px; font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
  .compare-provider-row .track { flex: 1; height: 14px; border-radius: 4px; background: var(--gridline); overflow: hidden; }
  .compare-provider-row .fill { display: block; height: 100%; border-radius: 4px; }
  .compare-provider-row .pct { width: 40px; font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-secondary); }

  section.dim-hidden { display: none; }
  .provider-panel.hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Ground-truth accuracy dashboard</h1>
    <div class="meta" id="meta-line"></div>
  </header>

  <div id="compare-section"></div>

  <div class="tabs" id="provider-tabs"></div>
  <div id="provider-panels"></div>
</div>

<script id="eval-data" type="application/json">__EVAL_DATA__</script>
<script>
(function () {
  const data = JSON.parse(document.getElementById('eval-data').textContent);
  const seriesColors = ['var(--series-1)', 'var(--series-2)', 'var(--series-3)'];
  const caseLabel = { positive: 'Positive', negative: 'Negative', partial: 'Partial', ambiguous: 'Ambiguous' };

  function pct(n) { return n === null || n === undefined ? '—' : Math.round(n) + '%'; }
  function esc(s) {
    return (s === null || s === undefined ? '' : String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }

  document.getElementById('meta-line').innerHTML =
    `Dataset: <code>${esc(data.dataset)}</code> — ${data.listing_count} listings &middot; generated ${esc(new Date(data.generated_at).toLocaleString())}`;

  const providerKeys = Object.keys(data.providers);

  // ---- provider comparison (only when more than one provider) ----
  if (providerKeys.length > 1) {
    const allDimKeys = data.providers[providerKeys[0]].dimensions.map(d => d.key);
    const dimLabel = {};
    data.providers[providerKeys[0]].dimensions.forEach(d => dimLabel[d.key] = d.label);

    let html = '<div class="card"><h2>Provider comparison — accuracy by dimension</h2>';
    html += '<div class="legend">' + providerKeys.map((p, i) =>
      `<span><span class="dot" style="background:${seriesColors[i % 3]}"></span>${esc(p)}</span>`).join('') + '</div>';

    allDimKeys.forEach(key => {
      html += `<div class="compare-bar-group"><div>${esc(dimLabel[key])}</div><div>`;
      providerKeys.forEach((p, i) => {
        const dim = data.providers[p].dimensions.find(d => d.key === key);
        const acc = dim.stats.accuracy;
        html += `<div class="compare-provider-row">
          <span class="name">${esc(p)}</span>
          <span class="track"><span class="fill" style="width:${acc === null ? 0 : acc}%;background:${seriesColors[i % 3]}"></span></span>
          <span class="pct">${pct(acc)}</span>
        </div>`;
      });
      html += '</div></div>';
    });

    html += '<div class="compare-bar-group"><div><b>Overall</b></div><div>';
    providerKeys.forEach((p, i) => {
      const acc = data.providers[p].overall.accuracy;
      html += `<div class="compare-provider-row">
        <span class="name">${esc(p)}</span>
        <span class="track"><span class="fill" style="width:${acc === null ? 0 : acc}%;background:${seriesColors[i % 3]}"></span></span>
        <span class="pct">${pct(acc)}</span>
      </div>`;
    });
    html += '</div></div></div>';

    document.getElementById('compare-section').innerHTML = html;
  }

  // ---- per-provider tabs + panels ----
  const tabsEl = document.getElementById('provider-tabs');
  const panelsEl = document.getElementById('provider-panels');

  if (providerKeys.length <= 1) {
    tabsEl.style.display = 'none';
  }

  providerKeys.forEach((p, idx) => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (idx === 0 ? ' active' : '');
    tab.textContent = `${p} (${data.providers[p].model})`;
    tab.onclick = () => selectProvider(p);
    tabsEl.appendChild(tab);

    const panel = document.createElement('div');
    panel.className = 'provider-panel' + (idx === 0 ? '' : ' hidden');
    panel.id = 'panel-' + p;
    panel.innerHTML = renderProvider(data.providers[p]);
    panelsEl.appendChild(panel);
  });

  function selectProvider(p) {
    [...tabsEl.children].forEach(t => t.classList.toggle('active', t.textContent.startsWith(p + ' (')));
    [...panelsEl.children].forEach(panel => panel.classList.toggle('hidden', panel.id !== 'panel-' + p));
  }

  function renderProvider(pdata) {
    let html = '';
    html += '<div class="stat-row">';
    html += statTile('Overall accuracy', pct(pdata.overall.accuracy), `${pdata.overall.correct}/${pdata.overall.total} graded cases`);
    html += statTile('Total graded cases', pdata.overall.total, 'positive + negative + partial');
    html += statTile('Correct', pdata.overall.correct, '');
    html += statTile('Incorrect', pdata.overall.total - pdata.overall.correct, '');
    html += statTile('Ungraded (ambiguous)', pdata.overall.ungraded, 'shown, not graded');
    html += '</div>';

    pdata.dimensions.forEach(dim => { html += renderDimension(dim); });
    return html;
  }

  function statTile(label, value, sub) {
    return `<div class="stat-tile">
      <div class="label">${esc(label)}</div>
      <div class="value">${esc(value)}</div>
      ${sub ? `<div class="sub">${esc(sub)}</div>` : ''}
    </div>`;
  }

  function renderDimension(dim) {
    const stats = dim.stats;
    const incorrectPct = stats.total ? 100 - (stats.correct / stats.total * 100) : 0;
    const correctPct = stats.total ? (stats.correct / stats.total * 100) : 0;

    let html = `<div class="card">
      <h2>${esc(dim.label)} <span style="color:var(--text-muted);font-weight:400">— ${pct(stats.accuracy)}${stats.ungraded ? ` (${stats.ungraded} ungraded)` : ''}</span></h2>
      <div class="query">query: <code>${esc(dim.query)}</code></div>`;

    if (dim.type === 'ambiguous') {
      html += `<div class="ambiguous-note">Ambiguous-first dimension: rows marked "Ambiguous" below have no defensible ground truth and are shown for transparency only — not counted in the accuracy above.</div>`;
    }

    html += `<div class="bar-row">
        <div class="bar-track">
          ${correctPct > 0 ? `<span class="bar-seg good" style="width:${correctPct}%"></span>` : ''}
          ${incorrectPct > 0 ? `<span class="bar-seg critical" style="width:${incorrectPct}%"></span>` : ''}
        </div>
        <span class="bar-pct">${pct(stats.accuracy)}</span>
      </div>
      <div class="legend">
        <span><span class="dot" style="background:var(--status-good)"></span>Correct</span>
        <span><span class="dot" style="background:var(--status-critical)"></span>Incorrect</span>
      </div>
      <div class="case-breakdown">`;

    Object.keys(stats.by_case).forEach(caseKey => {
      const c = stats.by_case[caseKey];
      const ungradedNote = c.total > c.graded ? ` (${c.total - c.graded} ungraded)` : '';
      html += `<span>${esc(caseLabel[caseKey] || caseKey)}: <b>${c.correct}/${c.graded}</b>${ungradedNote}</span>`;
    });
    html += '</div>';

    html += '<div class="table-wrap"><table><thead><tr>' +
      '<th>MLS ID</th><th>Address</th><th>Case</th><th>Expected</th><th>Actual score</th><th>Result</th><th>Reason</th>' +
      '</tr></thead><tbody>';

    dim.rows.forEach(r => {
      html += `<tr>
        <td class="num">${r.mls_id}</td>
        <td>${esc(r.address || '—')}</td>
        <td><span class="chip">${esc(caseLabel[r.case] || r.case)}</span></td>
        <td>${esc(r.expected)}</td>
        <td class="num">${r.actual_score === null ? '—' : r.actual_score}</td>
        <td>${r.pass === true
          ? '<span class="badge pass">✓ PASS</span>'
          : r.pass === false
            ? '<span class="badge fail">✗ FAIL</span>'
            : '<span class="badge neutral">— N/A</span>'}</td>
        <td class="reason">${esc(r.reason)}</td>
      </tr>`;
    });
    html += '</tbody></table></div>';

    if (dim.excluded.length) {
      html += `<div class="excluded">Excluded from this dimension as ambiguous in the source data (not counted above): ` +
        dim.excluded.map(e => `#${e.mls_id} ${esc(e.address || '')}`).join(', ') + '</div>';
    }

    html += '</div>';
    return html;
  }
})();
</script>
</body>
</html>
